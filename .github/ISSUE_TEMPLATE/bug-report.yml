name: 报告 Bug
description: 报告配置、脚本或桌面行为不正确
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **顶栏、面板、启动器等 shell 组件的问题请提到 [shell 仓库](https://github.com/caelestia-dots/shell/issues)。**
        > 本仓库只维护 dotfiles（Hyprland / 终端 / 编辑器 / 主题等配置）。
        >
        > **如果你依据文档操作遇到了问题，请先确认是「文档与实际情况不符」还是配置本身有 Bug。**

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有重复
          required: true
        - label: 这不是安全漏洞报告（安全漏洞请走 SECURITY.md 的私下通道）
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及的组件
      options:
        - Hyprland / Wayland
        - fish / foot（终端）
        - fastfetch / btop（系统信息）
        - firefox / zen（浏览器主题）
        - thunar（文件管理器）
        - micro / nvim / vscode / zed（编辑器）
        - 主题 / scheme / 配色
        - 安装 / 更新（caelestia CLI）
        - 文档与脚本本身
        - 其它
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么，以及你期望发生什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出准确的命令或操作序列，不要写「按文档操作」。
      placeholder: |
        1. 执行 `caelestia update`
        2. 重新登录 Hyprland
        3. 出现……
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 运行 `caelestia -v`，并附上本仓库的提交号（`git rev-parse --short HEAD`）。
      placeholder: caelestia 1.x / 639dd6e
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      description: 发行版与版本、Hyprland 版本、GPU / 显示服务器。
      placeholder: Arch Linux / Hyprland 0.5x / Wayland / NVIDIA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        Hyprland 日志、`journalctl`、终端输出等。**请贴文本，不要只贴截图** —— 文本可以搜索和引用。
        注意删除日志中的个人信息。
      render: shell
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: 你已经尝试过什么
      description: 排查过程能帮我们省下大量时间，即使没有成功也值得写。
    validations:
      required: false
